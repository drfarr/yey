<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nap</title>
<meta name="description" content="Paste anything. Find out what you could have slept through.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😴</text></svg>">
<link rel="canonical" href="__PUBLIC_URL__/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="nap">
<meta property="og:url" content="__PUBLIC_URL__/">
<meta property="og:title" content="nap — paste anything, find out what you could have slept through">
<meta property="og:description" content="Emails, Slack threads, meeting notes, terms of service. nap tells you the one thing that mattered and how much of it was filler.">
<meta property="og:image" content="__PUBLIC_URL__/api/og">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="nap — paste anything, find out what you could have slept through">
<meta name="twitter:image" content="__PUBLIC_URL__/api/og">
<style>
  :root { color-scheme: dark; --bg:#0b0b10; --fg:#f2f1ec; --mute:rgba(242,241,236,.55); --card:#15151d; --line:#23232e; --accent:#ffd166; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:56px 16px 96px; }
  h1 { font-size:64px; letter-spacing:-.05em; margin:0; line-height:1; }
  h1 span { display:inline-block; animation: nod 3.2s ease-in-out infinite; transform-origin: 60% 100%; }
  @keyframes nod { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-6deg)} }
  .tag { color:var(--mute); margin:10px 0 32px; font-size:19px; }
  textarea { width:100%; min-height:220px; resize:vertical; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:16px; padding:18px; font:16px/1.5 inherit; outline:none; }
  textarea:focus { border-color:rgba(255,209,102,.6); }
  .row { display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button { cursor:pointer; border:0; border-radius:12px; padding:14px 22px; font:inherit; font-weight:700; }
  .go { background:var(--fg); color:var(--bg); font-size:18px; }
  .go:disabled { opacity:.5; cursor:wait; }
  .ghost { background:transparent; color:var(--mute); padding:14px 10px; font-weight:500; }
  .ghost:hover { color:var(--fg); }
  .hint { color:var(--mute); font-size:14px; margin-left:auto; }
  .err { color:#ff8a8a; margin-top:12px; min-height:1.5em; }
  #card { display:none; margin-top:44px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 28px; }
  #card.show { display:block; animation: rise .35s ease-out; }
  @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .score { font-size:96px; font-weight:800; letter-spacing:-.05em; line-height:1; color:var(--accent); }
  .score small { font-size:22px; font-weight:600; color:var(--mute); margin-left:8px; letter-spacing:0; }
  .verdict { font-size:27px; font-weight:700; margin:12px 0 26px; line-height:1.25; }
  h3 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:22px 0 6px; }
  ul { padding-left:20px; margin:0; } li { margin:6px 0; }
  .pill { display:inline-block; background:#1f1f2a; padding:6px 12px; border-radius:999px; font-size:14px; color:var(--mute); margin-top:26px; }
  .og { display:none; width:100%; border-radius:14px; border:1px solid var(--line); margin-top:22px; }
  .og.ready { display:block; }
  .share { display:flex; gap:10px; flex-wrap:wrap; margin-top:26px; }
  .share button, .share a { background:#23232e; color:var(--fg); text-decoration:none; padding:12px 16px; border-radius:12px; font-size:15px; font-weight:600; }
  .share a { display:inline-block; }
  footer { margin-top:64px; color:var(--mute); font-size:14px; }
  footer a { color:inherit; }
  @media (max-width:480px){ h1{font-size:52px} .score{font-size:76px} .verdict{font-size:23px} }
</style>
</head>
<body>
<main>
  <h1><span>nap</span></h1>
  <p class="tag">Paste anything. Find out what you could have slept through.</p>

  <textarea id="text" placeholder="That 900-word email. The Slack thread with 47 replies. The 'quick sync' notes. The terms of service. Paste it." spellcheck="false"></textarea>
  <div class="row">
    <button class="go" id="go">nap it</button>
    <button class="ghost" id="sample">try a sample</button>
    <span class="hint" id="count">⌘/Ctrl + Enter</span>
  </div>
  <div class="err" id="err"></div>

  <section id="card">
    <div class="score"><span id="score">0</span>%<small>nappable</small></div>
    <div class="verdict" id="verdict"></div>
    <h3>tl;dr</h3><p id="tldr"></p>
    <div id="ntkWrap"><h3>need to know</h3><ul id="ntk"></ul></div>
    <h3>do this</h3><p id="action"></p>
    <span class="pill" id="stats"></span>
    <img class="og" id="og" alt="Your nap card" loading="lazy">
    <div class="share">
      <button id="copy">copy card</button>
      <a id="tweet" target="_blank" rel="noopener">post it</a>
      <button id="link">copy link</button>
      <a id="download" download="nap.png">save image</a>
    </div>
  </section>

  <footer>nap reads it so you don't have to. The text you paste is never stored, only the result behind your share link, for 30 days. <a href="https://github.com/drfarr/yey/tree/main/nap">source</a></footer>
</main>
<script defer src="/_vercel/insights/script.js"></script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var text = $('text'), go = $('go'), err = $('err'), card = $('card'), count = $('count');
  var last = null;
  var sleepy = ['zzz…', 'skimming for you…', 'finding the one sentence that mattered…', 'counting the pleasantries…', 'almost awake…'];

  var SAMPLE = "Hi team,\n\nHope everyone had a restful weekend and is easing back into the week nicely! I just wanted to take a quick moment to circle back on a few things that came up during last week's sync, as well as touch base on some upcoming items that I think are worth having on everyone's radar as we move into the back half of the quarter.\n\nFirst of all, a big thank you to everyone who contributed to the planning session. There were a lot of great ideas shared and I think we're in a really strong position moving forward. I know it was a long meeting and I appreciate everyone's patience and engagement throughout.\n\nIn terms of next steps, I'll be putting together a summary doc over the next few days, so keep an eye out for that. In the meantime, if anyone has any additional thoughts or feedback, please don't hesitate to reach out, my door is always open (virtually speaking, of course!).\n\nOne quick thing: the Q3 report deadline has moved from Friday to Wednesday at noon. Please make sure your sections are in the shared folder by then.\n\nAlso, just a gentle reminder that the office kitchen will be getting a deep clean on Thursday, so please make sure to remove any personal items from the fridge by Wednesday evening. Anything left behind will unfortunately be thrown out.\n\nLastly, I wanted to flag that we'll be trialling a new meeting format for the weekly sync starting next month. More details to follow, but the general idea is to keep things a bit more focused and action-oriented. I'm really excited about this and think it'll be a positive change for everyone.\n\nThanks again for all your hard work. Let's make it a great week!\n\nBest,\nJordan";

  function setLoading(on) {
    go.disabled = on;
    if (on) {
      var i = 0;
      go.textContent = sleepy[0];
      go._t = setInterval(function () { i = (i + 1) % sleepy.length; go.textContent = sleepy[i]; }, 1400);
    } else {
      clearInterval(go._t);
      go.textContent = 'nap it';
    }
  }

  function words(s) { return s.trim() ? s.trim().split(/\s+/).length : 0; }
  text.addEventListener('input', function () {
    var w = words(text.value);
    count.textContent = w ? w.toLocaleString() + ' words · ~' + Math.max(1, Math.round(w / 238)) + ' min to read' : '⌘/Ctrl + Enter';
  });

  function render(r) {
    last = r;
    $('score').textContent = r.napScore;
    $('verdict').textContent = '“' + r.verdict + '”';
    $('tldr').textContent = r.tldr;
    var ul = $('ntk'); ul.innerHTML = '';
    r.needToKnow.forEach(function (b) { var li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
    $('ntkWrap').style.display = r.needToKnow.length ? '' : 'none';
    $('action').textContent = r.action;
    var mins = Math.round(r.stats.savedSeconds / 60);
    $('stats').textContent = r.stats.words.toLocaleString() + ' words · ' + (mins ? mins + ' min' : r.stats.savedSeconds + ' sec') + ' of your life saved';
    $('tweet').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(r.share + '\n' + r.url);
    var og = $('og'); og.classList.remove('ready'); og.onload = function () { og.classList.add('ready'); }; og.src = r.image;
    $('download').href = r.image;
    card.classList.add('show');
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { history.replaceState(null, '', '/#' + r.id); } catch (e) {}
  }

  function nap() {
    err.textContent = '';
    setLoading(true);
    fetch('/api/nap', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: text.value }) })
      .then(function (res) { return res.json().then(function (j) { if (!res.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); })
      .then(render)
      .catch(function (e) { err.textContent = e.message; })
      .then(function () { setLoading(false); });
  }

  function copy(s, btn, label) {
    navigator.clipboard.writeText(s).then(function () {
      var old = btn.textContent; btn.textContent = label; setTimeout(function () { btn.textContent = old; }, 1400);
    });
  }

  go.addEventListener('click', nap);
  text.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') nap(); });
  $('sample').addEventListener('click', function () { text.value = SAMPLE; text.dispatchEvent(new Event('input')); nap(); });
  $('copy').addEventListener('click', function () { if (last) copy(last.share + '\n' + last.url, this, 'copied'); });
  $('link').addEventListener('click', function () { if (last) copy(last.url, this, 'copied'); });
})();
</script>
</body>
</html>
